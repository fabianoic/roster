services:
  postgres:
    image: postgres:16-alpine
    container_name: roster-postgres
    environment:
      POSTGRES_DB: roster_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - roster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roster_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  roster_pg_data: