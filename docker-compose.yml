services:
  postgres:
    image: postgres:16-alpine
    container_name: roster-postgres
    environment:
      POSTGRES_DB: roster_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - roster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roster_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  roster:
    build: .
    container_name: roster-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: roster_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  roster_pg_data: